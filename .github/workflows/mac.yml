name: mac

on:
  push:
    branches: [main]
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/mac.yml"
  workflow_dispatch:
  # A published release gets the Mac zip attached.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4

      # release.sh builds one binary for Apple silicon and Intel Macs and zips
      # it as dist/ScreenCat-mac-<version>.zip. A release takes its version
      # from the tag (v1.2.0 -> 1.2.0).
      - name: Build and zip
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then export VERSION="${TAG#v}"; fi
          ./release.sh

      - name: Check both chips are in the binary
        run: |
          archs="$(lipo -archs ScreenCat.app/Contents/MacOS/ScreenCat)"
          echo "$archs"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]

      # Every clip on one sheet, drawn offscreen. It runs from outside the
      # repo, so the app must find its art in its own bundle, not in
      # mac/Assets. Fails if an art file is missing from the app or no sheet
      # is written.
      - name: Preview
        working-directory: ${{ runner.temp }}
        run: |
          app="$GITHUB_WORKSPACE/mac/ScreenCat.app"
          for f in Cat_Sprite_Sheet.png Cat_Shadow.png Cat_Ball.png CREDIT.txt; do
            test -s "$app/Contents/Resources/$f" || { echo "missing from the app: $f"; exit 1; }
          done
          "$app/Contents/MacOS/ScreenCat" --preview "$GITHUB_WORKSPACE/mac/preview.png"
          test -s "$GITHUB_WORKSPACE/mac/preview.png"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCat-mac
          path: mac/dist/*.zip

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCat-mac-preview
          path: mac/preview.png
          if-no-files-found: ignore

  # Only this job can write to the repository, and only for a published release.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ScreenCat-mac
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" out/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          shasum -a 256 out/*.zip
